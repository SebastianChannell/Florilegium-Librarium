name: Repair recoverable Librarium PDFs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-known-pdfs.yml"
      - "scripts/repair-known-pdfs.mjs"

permissions:
  contents: read

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[r2-pdf-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PDF repair tools
        run: sudo apt-get update && sudo apt-get install -y mupdf-tools qpdf poppler-utils
      - name: Repair and replace safe PDFs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_PUBLIC_BASE_URL: https://assets.sacrumflorilegium.com
        run: node scripts/repair-known-pdfs.mjs
