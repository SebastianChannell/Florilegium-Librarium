name: Deploy Librarium

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: librarium-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Supabase Worker secret is bound (never print its value)
        run: |
          npx wrangler secret list --format json > /tmp/librarium-secret-names.json
          node -e '
            const fs = require("node:fs");
            const secrets = JSON.parse(fs.readFileSync("/tmp/librarium-secret-names.json", "utf8"));
            if (!Array.isArray(secrets) || !secrets.some((item) => item.name === "SUPABASE_SECRET_KEY")) {
              console.error("SUPABASE_SECRET_KEY is not configured on florilegium-librarium in this Cloudflare account.");
              process.exit(1);
            }
            console.log("Required Supabase Worker secret binding is present.");
          '
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

