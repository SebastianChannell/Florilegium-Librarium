<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070606">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="A searchable index of books in Sacrum Florilegium.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Librarium — Sacrum Florilegium</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div class="site-shell">
      <header class="site-header">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Open book index" aria-controls="browse-sidebar" aria-expanded="false">›</button>
        <a class="wordmark" href="./" aria-label="Librarium home">
          <span>Sacrum Florilegium</span>
          <strong>Librarium</strong>
        </a>
        <p class="subtitle">Index librorum.</p>
        <details class="florilegium-menu">
          <summary>
            <span>Sites</span>
            <span class="florilegium-menu-chevron" aria-hidden="true"></span>
          </summary>
          <nav aria-label="Sacrum Florilegium sites">
            <p>Sacrum Florilegium</p>
            <a href="https://sacrumflorilegium.com/">Domus</a>
            <a href="https://biblia.sacrumflorilegium.com/">Biblia</a>
            <a href="https://florilegium-census.sebastianchannell99.workers.dev/">Census</a>
            <a href="https://librarium.sacrumflorilegium.com/" aria-current="page">Librarium</a>
            <a href="https://officium.sacrumflorilegium.com/">Officium</a>
            <a href="https://orarium.sacrumflorilegium.com/">Orarium</a>
            <a href="https://propria.sacrumflorilegium.com/">Propria</a>
          </nav>
        </details>
      </header>

      <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>
      <aside id="browse-sidebar" class="browse-sidebar" role="dialog" aria-modal="true" aria-label="Book index" aria-hidden="true" inert>
        <div class="browse-sidebar-header">
          <button id="sidebar-close" class="sidebar-close" type="button" aria-label="Close book index">‹</button>
        </div>
        <div class="browse-sidebar-content">
          <form id="search-form" class="search" role="search">
            <label class="visually-hidden" for="search-input">Search books and authors</label>
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
            <input id="search-input" name="q" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Search titles, authors, subjects…">
            <button id="clear-search" class="search-clear" type="button" aria-label="Clear search" hidden>×</button>
          </form>

          <div class="index-toolbar">
            <p id="result-count" class="result-count" aria-live="polite">Loading books…</p>
            <div class="maintenance-actions">
              <button id="reseed-catalogue" class="refresh-button" type="button" aria-label="Rebuild catalogue from Supabase without scanning PDFs" disabled hidden>Rebuild index</button>
              <button id="refresh-catalogue" class="refresh-button" type="button" aria-label="Import new PDFs and refresh catalogue" disabled hidden>Import &amp; refresh</button>
            </div>
          </div>
          <form id="refresh-auth-form" class="refresh-auth" hidden>
            <label for="refresh-key-input">Manual import key (not the Supabase secret)</label>
            <input id="refresh-key-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
            <div class="refresh-auth-actions">
              <button type="submit" id="refresh-auth-submit">Continue</button>
              <button type="button" id="refresh-auth-cancel">Cancel</button>
            </div>
          </form>
          <div id="status-message" class="status-message" role="status" aria-live="polite" hidden></div>
          <nav id="results" class="index-groups" aria-label="Books by classification"></nav>
        </div>
      </aside>

      <main id="main-content">
        <h1 class="visually-hidden">Librarium catalogue</h1>
      </main>

      <footer class="site-footer">
        <span aria-hidden="true">✠</span>
        <span>T.A.D.M.N.</span>
      </footer>
    </div>

    <noscript><p class="noscript">JavaScript is required to search the library.</p></noscript>
  </body>
</html>
